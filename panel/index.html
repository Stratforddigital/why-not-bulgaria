/* Layout: работен панел, лява навигация (горна лента на телефон), една страница = един процес */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunk:#ECEEEA; --ink:#1B2220; --muted:#5C6863; --line:#DCE1DD;
  --accent:#8C2340; --accent-ink:#FFFFFF; --accent-soft:#F4E4E9;
  --sage:#3D6A5A; --sage-soft:#E2EEE8;
  --good:#2C7A4B; --good-soft:#E1F1E7; --warn:#A86A12; --warn-soft:#F8EDD9; --bad:#B2372F; --bad-soft:#F7E2DF;
  --font-display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --font-body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#191F1D; --sunk:#141917; --ink:#E7ECE9; --muted:#9BA7A2; --line:#2A3330;
  --accent:#E07C98; --accent-ink:#1A0B10; --accent-soft:#3A2029;
  --sage:#86BBA7; --sage-soft:#1F302A;
  --good:#63C28A; --good-soft:#1B2E23; --warn:#E3B260; --warn-soft:#2F2615; --bad:#EC7D73; --bad-soft:#341D1B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#191F1D; --sunk:#141917; --ink:#E7ECE9; --muted:#9BA7A2; --line:#2A3330;
  --accent:#E07C98; --accent-ink:#1A0B10; --accent-soft:#3A2029;
  --sage:#86BBA7; --sage-soft:#1F302A;
  --good:#63C28A; --good-soft:#1B2E23; --warn:#E3B260; --warn-soft:#2F2615; --bad:#EC7D73; --bad-soft:#341D1B;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);width:18px}
.nav a.on .n{color:var(--accent)}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
/* main */
.main{min-width:0;padding-block:24px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.demo-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--sage-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:22px}
.demo-bar b{color:var(--sage)}
.page-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.page-head h1{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,2.6vw,26px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:15px;font-weight:600;margin:0 0 12px}
.panel h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.kpi{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
a.kpi:hover{border-color:var(--accent)}
.kpi .v{font-family:var(--font-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .go{font-size:13px;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.sage{background:var(--sage-soft);color:var(--sage)}
.badge{font-family:var(--font-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;font-weight:500}
/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
label.f span.h{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
input[type=range]{width:100%;accent-color:var(--accent)}
/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.score{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:600}
.score i{display:block;width:44px;height:6px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden}
.score i b{position:absolute;inset:0 auto 0 0;background:var(--sage);border-radius:3px}
.org{font-weight:600}
.flag{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13px}
.bar .track{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar .track span{display:block;height:100%}
.bar .t{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.c-sch{background:var(--accent)} .c-vet{background:var(--sage)} .c-adu{background:var(--warn)}
/* review */
.review{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px}
.proj dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;margin:0;font-size:13.5px}
.proj dt{color:var(--muted)}
.proj dd{margin:0;min-width:0;overflow-wrap:anywhere}
.why{background:var(--sage-soft);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.why b{color:var(--sage)}
.mail-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.mail{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.6;min-height:260px;overflow-wrap:anywhere}
.mail.editing{outline:2px solid var(--accent)}
.subj{font-weight:600;margin-bottom:8px}
.trans{margin-top:10px;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress b{display:block;height:100%;background:var(--accent);transition:width .3s}
/* replies */
.reply{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.msg{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg);font-size:14px;white-space:pre-wrap}
.list-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.list-item:hover{background:var(--sunk)}
.list-item.on{border-color:var(--accent);background:var(--accent-soft)}
.list-item .t{font-weight:600;font-size:14px}
.list-item .p{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:13px;margin:2px 4px 4px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.card .t{font-weight:600;font-size:13.5px}
/* inbox health */
.box{display:grid;grid-template-columns:minmax(0,1fr) 90px 120px 90px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.box:last-child{border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.big-out{font-family:var(--font-display);font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--bg)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0;font-size:14px;line-height:1}
.toggle{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:8px;width:fit-content;flex-wrap:wrap}
.toggle button{border:0;background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.toggle button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:13.5px}
.todo{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .x{flex:1;min-width:0}
.sev{width:4px;align-self:stretch;border-radius:2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.src{font-size:12px;color:var(--muted);margin-top:10px}
.src a{color:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.review,.reply{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .brand span,.side-foot{display:none}
  .brand b{white-space:nowrap;font-size:13px}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap;padding:6px 10px}
  .nav .n{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  .box .hide-sm{display:none}
  .bar{grid-template-columns:72px minmax(0,1fr) 50px}
}
@media (max-width:480px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi .v{font-size:24px}.proj dl{grid-template-columns:minmax(0,1fr)}.proj dt{margin-top:4px}}
</style>

  $("#rall").onclick=()=>{let n=0;while(S.qi<S.queue.length){P.find(x=>x.id===S.queue[S.qi]).st="approved";S.approved++;S.qi++;n++}toast(`${n} имейла са одобрени`);route()};
}

   </div>
   <div class="panel"><h2>Пощенски кутии <small>8 от 12 показани</small></h2>
    ${boxes.map(b=>{const c=b[2]>=90?"good":b[2]>=75?"warn":"bad";return `<div class="box"><div style="min-width:0"><div style="font-weight:600;overflow-wrap:anywhere">${b[1]}${b[0].split(" ")[0]}</div><div class="muted small">${b[0].includes("пример")?"примерен домейн":""}</div></div><div><span class="dot" style="background:var(--${c})"></span>${b[2]}%</div><div class="hide-sm small muted">${b[3]} на ден</div><div class="hide-sm">${c==="good"?'<span class="pill good">Здрава</span>':'<span class="pill bad">Намалена</span>'}</div></div>`}).join("")}
    <p class="src">SPF, DKIM и DMARC са настроени за всеки домейн. Новите кутии се „загряват“ 2–3 седмици преди да пращат пълния обем.</p>
   </div>
  </div>`;
}
function bindSending(){
  const upd=()=>{S.total=+$("#tt").value;S.inboxes=+$("#ib").value;S.perDay=+$("#pd").value;
    $("#tv").textContent=num(S.total);$("#iv").textContent=S.inboxes;$("#pv").textContent=S.perDay;
    const days=Math.ceil(S.total/(S.inboxes*S.perDay));$("#od").textContent=num(S.inboxes*S.perDay);$("#ow").textContent=Math.ceil(days/5)+" седм.";
    $("#onote").innerHTML=S.perDay>40?'<span class="pill bad">Риск</span> Над 40 на ден от кутия пощите бързо отиват в спама.':'Ръчно, при 5 минути на имейл, това са '+num(Math.round(S.total*5/60))+' часа работа.'};
  ["#tt","#ib","#pd"].forEach(s=>$(s).oninput=upd);
  $("#spause").onclick=e=>{const p=e.target.textContent==="Пауза за всичко";e.target.textContent=p?"Пусни отново":"Пауза за всичко";toast(p?"Изпращането е спряно":"Изпращането продължава")};
}

/* ---------- 8. Отговори ---------- */
function vReplies(){
  const r=REPLIES.find(x=>x.id===S.reply)||REPLIES[0];const c=CLS[r.cls];const done=S.sentDrafts[r.id];
  const canSend=r.cls==="hot";
  return head("Отговори","AI чете всеки отговор и го подрежда. Ти виждаш само тези, които искат нещо от теб.")+
  `<div class="reply">
   <div class="panel" style="padding:8px">${REPLIES.map(x=>`<div class="list-item ${x.id===r.id?"on":""}" data-r="${x.id}" tabindex="0" role="button"><div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between"><span class="t">${esc(x.from)}</span><span class="muted small">${x.when}</span></div><div class="p">${esc(x.text)}</div><div style="margin-top:6px"><span class="pill ${CLS[x.cls][1]}">${CLS[x.cls][0]}</span>${S.sentDrafts[x.id]?' <span class="pill good">Отговорено</span>':""}</div></div></div>`).join("")}</div>
   <div class="panel stack">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(r.from)}</h2><span class="pill ${c[1]}">${c[0]}</span></div>
    <div class="msg">${esc(r.text)}</div>
    <div class="eyebrow" style="margin-top:6px">${canSend?"Подготвен отговор":"Какво направи системата"}</div>
    ${canSend?`<textarea id="rd" rows="7">${esc(r.draft)}</textarea>`:`<div class="msg" style="background:var(--sunk)">${esc(r.draft)}</div>`}
    ${canSend?`<div class="row"><button class="btn primary" id="rsend" ${done?"disabled":""}>${done?"Изпратено":"Изпрати отговора"}</button><button class="btn" id="rdeal">Премести в „Разговор“</button></div>`:""}
   </div>
  </div>`;
}
function bindReplies(){
  document.querySelectorAll("[data-r]").forEach(el=>{el.onclick=()=>{S.reply=el.dataset.r;route()};el.onkeydown=e=>{if(e.key==="Enter"){S.reply=el.dataset.r;route()}}});
  if($("#rsend"))$("#rsend").onclick=()=>{S.sentDrafts[S.reply]=true;toast("Отговорът е изпратен");route()};
  if($("#rdeal"))$("#rdeal").onclick=()=>{const r=REPLIES.find(x=>x.id===S.reply);const i=DEALS["Интерес"].findIndex(d=>d.t===r.from);if(i>-1){DEALS["Разговор"].unshift(DEALS["Интерес"].splice(i,1)[0])}toast("Преместено в „Разговор“")};
}

/* ---------- 9. Сделки ---------- */
function vDeals(){
  return head("Сделки","От първия отговор до пристигането на групата в Пловдив. Натисни „→“, за да преместиш напред.")+
  `<div class="kanban">${Object.entries(DEALS).map(([k,arr],ci,all)=>`<div class="col"><h3>${k}<span class="muted">${arr.length}</span></h3>${arr.map((d,i)=>`<div class="card"><span class="t">${esc(d.t)}</span><span class="muted">${esc(d.d)}</span><div class="row" style="justify-content:space-between"><span class="pill sage">${esc(d.v)}</span>${ci<all.length-1?`<button class="btn sm ghost" data-mv="${k}|${i}" aria-label="Премести напред">→</button>`:""}</div></div>`).join("")||'<div class="muted small" style="padding:6px">Няма</div>'}</div>`).join("")}</div>
  <p class="src">Всички сделки на тази страница са примерни.</p>`;
}
function bindDeals(){document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.mv.split("|");const keys=Object.keys(DEALS);const nk=keys[keys.indexOf(k)+1];DEALS[nk].unshift(DEALS[k].splice(+i,1)[0]);toast(`Преместено в „${nk}“`);route()})}

/* ---------- 10. GDPR ---------- */
function vGdpr(){
  return head("GDPR и отписани","Пишем само до служебни адреси на организации, всеки имейл има линк за отписване и всичко се записва.")+
  `<div class="grid g2">
   <div class="panel stack"><h2>Текст в края на всеки имейл</h2>
    <textarea id="gf" rows="5">You are receiving this email because your organisation is listed as the coordinator of an Erasmus+ mobility project on the public Erasmus+ Project Results Platform. If you prefer not to hear from us, reply "unsubscribe" or use this link: [отписване]</textarea>
    <div class="row"><span class="pill good">Отписване с един клик ✓</span><span class="pill good">SPF, DKIM, DMARC ✓</span><span class="pill good">Лог на изпращанията ✓</span></div>
   </div>
   <div class="panel stack"><h2>Отписани адреси <small>${S.unsub.length}</small></h2>
    ${S.unsub.map(u=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px"><span class="mono">${esc(u)}</span><span class="muted small">никога повече</span></div>`).join("")}
    <div class="row"><input type="text" id="gu" placeholder="адрес за ръчно отписване" style="flex:1"><button class="btn sm" id="gadd">Добави</button></div>
    <p class="muted small" style="margin:0">Примерни адреси. Системата проверява този списък преди всяко изпращане.</p>
   </div>
  </div>
  <div class="panel" style="margin-top:14px"><h2>Основание за обработка</h2><p class="small" style="margin:0;max-width:75ch">Легитимен интерес (чл. 6, ал. 1, буква „е“ от GDPR) за делово предложение към организации, които публично изпълняват проекти по Еразъм+. Пазим само име на организацията, служебен имейл и публичните данни за проекта. Документът с преценката на легитимния интерес се пази тук и се преглежда веднъж годишно.</p></div>`;
}
function bindGdpr(){$("#gadd").onclick=()=>{const v=$("#gu").value.trim();if(v){S.unsub.unshift(v);route();toast("Адресът е отписан")}}}

/* ---------- рутиране ---------- */
const VIEWS={today:[vToday],find:[vFind,bindFind],contacts:[vContacts,bindContacts],style:[vStyle,bindStyle],campaigns:[vCampaigns,bindCampaigns],review:[vReview,bindReview],sending:[vSending,bindSending],replies:[vReplies,bindReplies],deals:[vDeals,bindDeals],gdpr:[vGdpr,bindGdpr]};
function route(){
  const k=(location.hash||"#today").slice(1);const v=VIEWS[k]||VIEWS.today;const key=VIEWS[k]?k:"today";
  renderNav(key);$("#view").innerHTML=v[0]();if(v[1])v[1]();
  document.title="Why Not Bulgaria Panel";
}
let lastKey=null;
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
</script>
